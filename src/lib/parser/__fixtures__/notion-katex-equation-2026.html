<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Sample Equations Set</title>
</head>
<body>
  <article class="page sans">
    <header>
      <h1 class="page-title">Sample Equations Set</h1>
    </header>
    <div class="page-body">
      <div style="display:contents" dir="auto">
        <ul class="toggle">
          <li>
            <details open="">
              <summary>State the mass energy equivalence relation.</summary>
              <div style="display:contents" dir="ltr">
                <figure class="equation" data-notion-equation="E = mc^2" dir="auto">
                  <div class="equation-container">
                    <span class="katex-display"><span class="katex"><span class="katex-html" aria-hidden="true">E=mc2</span></span></span>
                  </div>
                </figure>
              </div>
            </details>
          </li>
        </ul>
      </div>
    </div>
  </article>
</body>
</html>
