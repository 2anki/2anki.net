# The repo moved from the `2anki` SonarCloud org to `laer-smart`, which changed
# the project key. The old project (`2anki_server` in org `2anki`) kept
# auto-scanning `main` for weeks afterwards, so nothing looked broken — but it is
# a different project from the one now bound to the repo, and it has no quality
# gate. Verify with:
#   curl -s "https://sonarcloud.io/api/components/show?component=Laer-Smart_2anki.net"
sonar.projectKey=Laer-Smart_2anki.net
sonar.organization=laer-smart

sonar.sources=src,web/src
sonar.tests=src,web/src,web/tests
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx,web/tests/**

sonar.exclusions=src/templates/**,src/migrations/**,src/test/fixtures/**,src/lib/parser/__fixtures__/**,src/data_layer/public/**,src/config/swagger.ts,src/services/EmailService/templates/**,web/build/**,web/mock-server/**,web/src/generated/**,web/src/schemas/**,web/src/react-app-env.d.ts,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.coverage.exclusions=src/templates/**,src/migrations/**,src/test/fixtures/**,src/data_layer/public/**,src/config/swagger.ts,web/mock-server/**,web/src/generated/**,web/src/schemas/**,web/src/react-app-env.d.ts,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.cpd.exclusions=src/migrations/**,src/data_layer/public/**,web/src/generated/**,web/src/schemas/**,web/src/pages/OpsPage/performanceTypes.ts,web/src/pages/ConvertLandingPage/convertLandingConfig.ts,web/src/pages/ConvertHubPage/convertHubGroups.ts,web/src/pages/LandingPage/copy/**,src/controllers/CardOptionsController/supportedOptions.ts,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx

sonar.javascript.lcov.reportPaths=coverage/lcov.info,web/coverage/lcov.info

sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Rule waivers — mock server is intentionally permissive (CORS, HTTP verbs);
# test fixtures may carry placeholder credentials for completeness.
#
# Note on instrumentedAxios.ts (tssecurity:S5144 / S7044): the taint-analysis
# engine cannot follow the URL through measure() -> validateAndResolveUrl()
# -> isHostOnFixedAllowlist() / resolveHostnameSafely(). The URL IS validated
# (https-only, fixed-host allowlist or private-IP rejection, DNS resolved with
# every returned address checked, IP pinned into axios via per-request
# `lookup`). Multicriteria ignore rules do NOT apply to tssecurity taint
# findings, so these are tracked as "False Positive" in the SonarCloud UI.
# Email template HTML uses table-based layout, deprecated presentational
# attributes, and 4.5:1-borderline contrast on purpose: email clients
# (Gmail, Outlook, Apple Mail) require these patterns for cross-client
# rendering. The whole templates folder is excluded via sonar.exclusions
# but the Web plugin discovers HTML files independently, so each rule
# needs an explicit waiver to keep the gate clean.
sonar.issue.ignore.multicriteria=mock1,mock2,test1,test2,gen1,gen2,email1,email2,email3,email4,i18n1,jitter1,jitter2,upload1
sonar.issue.ignore.multicriteria.mock1.ruleKey=javascript:S5122
sonar.issue.ignore.multicriteria.mock1.resourceKey=web/mock-server/**
sonar.issue.ignore.multicriteria.mock2.ruleKey=javascript:S5689
sonar.issue.ignore.multicriteria.mock2.resourceKey=web/mock-server/**
sonar.issue.ignore.multicriteria.test1.ruleKey=javascript:S2068
sonar.issue.ignore.multicriteria.test1.resourceKey=web/tests/**
sonar.issue.ignore.multicriteria.test2.ruleKey=javascript:S1481
sonar.issue.ignore.multicriteria.test2.resourceKey=web/tests/**
sonar.issue.ignore.multicriteria.gen1.ruleKey=*
sonar.issue.ignore.multicriteria.gen1.resourceKey=web/src/generated/**
sonar.issue.ignore.multicriteria.gen2.ruleKey=*
sonar.issue.ignore.multicriteria.gen2.resourceKey=web/src/schemas/**
sonar.issue.ignore.multicriteria.email1.ruleKey=Web:S1827
sonar.issue.ignore.multicriteria.email1.resourceKey=src/services/EmailService/templates/**
sonar.issue.ignore.multicriteria.email2.ruleKey=Web:S5257
sonar.issue.ignore.multicriteria.email2.resourceKey=src/services/EmailService/templates/**
sonar.issue.ignore.multicriteria.email3.ruleKey=Web:S6819
sonar.issue.ignore.multicriteria.email3.resourceKey=src/services/EmailService/templates/**
sonar.issue.ignore.multicriteria.email4.ruleKey=css:S7924
sonar.issue.ignore.multicriteria.email4.resourceKey=src/services/EmailService/templates/**

sonar.qualitygate.wait=true

# i18n1: the locale JSON carries UI strings for the password screens ("Forgot
# password?", "New password"), which the secret detector reads as credentials.
# jitter1/jitter2: retry backoff jitter is not a security context — see the
# S2245 carve-out in .claude/rules/security.md. Do NOT swap these for crypto.
# upload1: every multer instance under src/routes/ already declares an explicit
# limits.fileSize cap (10MB chat/contact/occlusion, 25MB feedback, 50MB PDF
# retry, 100MB apkg). S5693 asks you to confirm the cap is safe; it is, and the
# rule cannot tell. If you add a NEW upload route, set limits.fileSize on it —
# this waiver will hide a missing cap.
sonar.issue.ignore.multicriteria.i18n1.ruleKey=json:S2068
sonar.issue.ignore.multicriteria.i18n1.resourceKey=web/src/lib/i18n/locales/**
sonar.issue.ignore.multicriteria.jitter1.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.jitter1.resourceKey=src/services/NotionService/helpers/withRetry.ts
sonar.issue.ignore.multicriteria.jitter2.ruleKey=typescript:S2245
sonar.issue.ignore.multicriteria.jitter2.resourceKey=src/lib/storage/jobs/helpers/withStripeRetry.ts
sonar.issue.ignore.multicriteria.upload1.ruleKey=typescript:S5693
sonar.issue.ignore.multicriteria.upload1.resourceKey=src/routes/**
